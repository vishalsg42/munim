# Security updates without a human remembering to look.
#
# Grouped and monthly on purpose: this is a small project with one maintainer,
# and a weekly stream of single-dependency pull requests is a stream nobody
# reads. Security advisories are not grouped or delayed by this file; GitHub
# raises those as soon as they land.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # Minor and patch only. A major bump is a decision, not an update: this
    # codebase reads Strands internals and the MCP SDK's own behaviour, so a
    # new major version is a thing to sit down with rather than something to
    # approve between other work. Dependabot also widens the declared ceiling
    # when it proposes one, which is how `mcp<2.0.0` briefly became `<3.0.0`
    # and quietly permitted a version nobody had run.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Same rule. A major action bump changes inputs and can break a workflow in
    # a way that only shows on the run that needed it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
