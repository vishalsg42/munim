name: publish

# Trusted publishing: PyPI verifies this workflow's identity through GitHub, so
# no token exists to leak. It does nothing until a pending publisher is added on
# PyPI for this repository, this filename and the `pypi` environment.
#
# Fires on a tag, not on every push. A version on PyPI can never be reused or
# withdrawn, so publishing has to be a thing somebody decided rather than a
# thing that happened.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default for every job below. `publish` overrides it, because a job-level
# grant replaces this one rather than adding to it, and trusted publishing needs
# a token minted for the occasion.
permissions:
  contents: read

jobs:
  # The tests run again here rather than trusting the run on the commit. A tag
  # can point anywhere, including at something that never passed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --extra dev
      - run: uv run pytest -q

      # A tag that disagrees with pyproject publishes the wrong version number,
      # and PyPI will not let it be republished under the right one. Cheaper to
      # catch here than to burn a version.
      - name: The tag matches the version being published
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(uv run python -c "
          import pathlib, sys
          text = pathlib.Path('pyproject.toml').read_text()
          try:
              import tomllib          # stdlib from 3.11; this package allows 3.10
              print(tomllib.loads(text)['project']['version'])
          except ModuleNotFoundError:
              import re
              print(re.search(r'^version = \"([^\"]+)\"', text, re.M).group(1))
          ")
          echo "tag=$tagged pyproject=$declared"
          test "$tagged" = "$declared" || {
            echo "::error::tag v$tagged does not match pyproject version $declared"
            exit 1
          }

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv build

      # The control room ships inside the wheel so an install needs no npm. A
      # wheel without it installs and then fails at the first `munim-room`,
      # which is a bad way to find out.
      - name: The wheel carries the built control room
        run: |
          uv run python -c "
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          static = [n for n in names if 'room/static' in n]
          print(f'{len(static)} control room files in the wheel')
          sys.exit(0 if static else 'the wheel has no control room')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read    # restated: a job-level grant replaces, not extends
      id-token: write   # what trusted publishing uses instead of a token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  # The official MCP Registry, which lists the server rather than hosting it.
  # It verifies ownership by looking for `mcp-name: io.github.vishalsg42/munim`
  # in the PyPI long description, which is README.md, so this has to run after
  # the package is on PyPI rather than beside it.
  #
  # Same shape as the publish job above and for the same reason: `login
  # github-oidc` mints a token for the occasion, so there is no secret to leak
  # and none to rotate.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Pinned, like every action here. A `latest` download is the same moving
      # target a floating tag is, and this one runs in a job holding an OIDC
      # identity the registry trusts.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      # The tag is the single source of the version. server.json carries one so
      # it validates and so `mcp-publisher publish` can be run by hand, but a
      # number written in two files is a number that will disagree.
      - name: The version comes from the tag, in both places it appears
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '"publishing \(.name) \(.version), pypi \(.packages[0].identifier) \(.packages[0].version)"' server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
