[project]
name = "munim"
version = "0.3.0"
description = "One MCP server holding a live session with every client's account at once."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vishal Gupta" }]
keywords = ["mcp", "model-context-protocol", "multi-account", "cloudflare",
            "vercel", "dns", "spf", "dkim", "dmarc", "strands"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: Name Service (DNS)",
]

dependencies = [
    "strands-agents==1.54.0",
    "mcp>=1.23.0,<2.0.0",
    "keyring>=25.7.0",
    "httpx>=0.28.1",
    "dnspython>=2.7.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Strands ships Gemini and Anthropic as extras, so a bare install has
# strands.models.gemini on disk with no `google` package underneath it. Until
# these existed, build_model raised ModuleNotFoundError for two of the three
# hosts this project documents, while doctor reported them as fine.
gemini = ["strands-agents[gemini]==1.54.0"]
anthropic = ["strands-agents[anthropic]==1.54.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
munim = "munim.cli:main"
munim-mcp = "munim.server:main"
munim-room = "munim.room.server:main"

[project.urls]
Homepage = "https://github.com/vishalsg42/munim"
Repository = "https://github.com/vishalsg42/munim"
Issues = "https://github.com/vishalsg42/munim/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
