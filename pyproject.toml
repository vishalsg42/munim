[project]
name = "munim"
version = "0.1.0"
description = "Per-client containers for multi-account client infrastructure work, over MCP."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "strands-agents==1.54.0",
    "mcp>=1.23.0,<2.0.0",
    "keyring>=25.7.0",
    "httpx>=0.28.1",
    "dnspython>=2.7.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
munim = "munim.cli:main"
munim-mcp = "munim.server:main"
munim-room = "munim.room.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
